# Sonic Screwdriver: run the fork's asteroid-launcher through
# /usr/local/libexec/sonic/launcher, which falls back to the stock
# /usr/bin/asteroid-launcher after a crash loop.
# Installed by sonic/deploy.sh as
# /etc/systemd/user/asteroid-launcher.service.d/sonic.conf.
# Undo: sonic/deploy.sh --stock
[Service]
ExecStart=
ExecStart=/usr/local/libexec/sonic/launcher $LIPSTICK_OPTIONS --systemd
